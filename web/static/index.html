<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Game V2</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css?v=9">
    <link rel="stylesheet" href="/static/css/layout.css?v=11">
    <link rel="stylesheet" href="/static/css/components.css?v=10">
    <link rel="stylesheet" href="/static/css/setup.css?v=9">
    <link rel="stylesheet" href="/static/css/game.css?v=10">
    <link rel="stylesheet" href="/static/css/modals.css?v=9">
</head>
<body>
    <div id="app">
        <!-- Background Scenery -->
        <div class="scenery-layer" aria-hidden="true">
            <div class="scenery-backdrop day-backdrop"></div>
            <div class="scenery-backdrop night-backdrop"></div>
            <div class="scenery-scrim"></div>
            <div class="stars"></div>
            <div class="cloud"></div>
            <div class="cloud"></div>
            <div class="cloud"></div>
        </div>

        <!-- Theatrical Stage Curtain Scene Change -->
        <div id="stage-curtain" class="stage-curtain-overlay" aria-hidden="true">
            <div class="curtain-pelmet">
                <div class="pelmet-valance"></div>
                <div class="pelmet-fringe"></div>
            </div>
            <div class="curtain-wing curtain-left">
                <div class="curtain-fabric"></div>
                <div class="curtain-folds">
                    <span class="fold"></span>
                    <span class="fold"></span>
                    <span class="fold"></span>
                    <span class="fold"></span>
                </div>
                <div class="curtain-gold-trim"></div>
                <div class="curtain-tassel left-tassel"></div>
            </div>
            <div class="curtain-wing curtain-right">
                <div class="curtain-fabric"></div>
                <div class="curtain-folds">
                    <span class="fold"></span>
                    <span class="fold"></span>
                    <span class="fold"></span>
                    <span class="fold"></span>
                </div>
                <div class="curtain-gold-trim"></div>
                <div class="curtain-tassel right-tassel"></div>
            </div>
            <div class="curtain-placard-wrap">
                <div class="placard-ropes">
                    <div class="placard-rope rope-left"></div>
                    <div class="placard-rope rope-right"></div>
                </div>
                <div class="stage-placard">
                    <div class="placard-inner">
                        <span class="placard-icon" id="curtain-icon">🌙</span>
                        <div class="placard-text-box">
                            <span class="placard-title" id="curtain-title">天黑请闭眼</span>
                            <span class="placard-subtitle" id="curtain-subtitle">Night Falls · Close Your Eyes</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Login / Setup Screen -->
        <div id="setup-screen" class="screen active">
            <div class="top-fixed-controls">
                <button id="lobby-audio-btn" class="top-fixed-btn" title="Toggle Music" aria-label="Toggle Music">🎵 <span class="audio-label">音乐</span></button>
                <button id="lobby-lang-btn" class="top-fixed-btn lang-toggle-fixed">中文/EN</button>
            </div>
            <div class="setup-container" role="main">
                <h1>Werewolf</h1>
                <div class="form-group">
                    <label>Select Avatar</label>
                    <div class="avatar-grid" id="avatar-selection">
                        <!-- Avatars injected by JS -->
                    </div>
                </div>
                <div class="form-group">
                    <label>Number of Players</label>
                    <div class="toggle-group" id="player-count-group">
                        <button class="toggle-btn" data-value="6">6</button>
                        <button class="toggle-btn active" data-value="9">9</button>
                        <button class="toggle-btn" data-value="12">12</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Select Role</label>
                    <div class="role-grid" id="role-selection">
                        <!-- Roles injected by JS -->
                    </div>
                </div>
                
                <button id="open-settings-btn" class="secondary-btn">⚙️ Advanced Settings</button>

                <button id="start-game-btn" class="primary-btn">Start Game</button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content settings-content">
                <span class="close-modal" id="close-settings-btn">&times;</span>
                <h2 id="settings-modal-title">Advanced Settings</h2>
                <div class="form-group">
                    <label id="setting-timer-label">Turn Timer</label>
                    <div class="timer-setting-row">
                        <select id="turn-timer-select">
                            <option value="60" data-i18n="min1">1 Minute (60s)</option>
                            <option value="120" data-i18n="min2" selected>2 Minutes (120s)</option>
                            <option value="180" data-i18n="min3">3 Minutes (180s)</option>
                            <option value="300" data-i18n="min5">5 Minutes (300s)</option>
                            <option value="600" data-i18n="min10">10 Minutes (600s)</option>
                            <option value="custom" data-i18n="custom">Custom...</option>
                        </select>
                        <div id="custom-timer-container" class="custom-timer-container" style="display: none;">
                            <input type="number" id="custom-timer-input" min="1" max="60" placeholder="Mins">
                            <span id="custom-timer-unit" class="custom-timer-unit">min</span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label id="setting-provider-label">Provider</label>
                    <select id="provider-select">
                        <option value="openai">OpenAI</option>
                        <option value="doubao">Doubao (Volcengine)</option>
                        <option value="gemini">Gemini (Google)</option>
                        <option value="qwen">Qwen (Aliyun)</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="setting-apikey-label">API Key</label>
                    <input type="password" id="api-key" placeholder="API Key">
                </div>
                <div class="form-group">
                    <label id="setting-baseurl-label">Base URL (Optional)</label>
                    <input type="text" id="base-url" placeholder="e.g. https://api.openai.com/v1">
                </div>
                <div class="form-group">
                    <label id="setting-modelname-label">Model Name (Optional)</label>
                    <input type="text" id="model-name" placeholder="e.g. gpt-4o">
                </div>
                <button id="save-settings-btn" class="primary-btn">Save & Close</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <header class="game-header">
                <div class="header-left">
                    <div class="phase-indicator" id="phase-indicator">Day 1</div>
                </div>
                <div class="header-right">
                    <button id="audio-toggle-btn" class="icon-btn header-pill-btn" title="Toggle Music" aria-label="Toggle Music">🎵 <span class="audio-label">音乐</span></button>
                    <button id="records-btn" class="icon-btn header-pill-btn" title="Game Records" aria-label="Game Records">📖 记录</button>
                    <button id="game-lang-btn" class="icon-btn header-pill-btn" title="Toggle Language" aria-label="Toggle Language">中文/EN</button>
                    <button id="toggle-debug-btn" title="Toggle Debug Logs" aria-label="Toggle Debug Logs">🐞</button>
                    <button id="game-settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
                    <button id="quit-btn" class="icon-btn" aria-label="Quit Game">✕</button>
                </div>
            </header>

            <main class="game-board" role="main">
                <div class="game-layout">
                    <!-- Left Column -->
                    <div class="side-column" id="players-left">
                        <!-- Players injected by JS -->
                    </div>
                    
                    <!-- Center Stage -->
                    <div class="center-area">
                        <div class="chat-box" id="chat-box" aria-live="polite">
                            <!-- Chat messages -->
                        </div>
                        <div id="new-messages-indicator" class="new-messages-indicator hidden">⬇️ 新消息</div>
                    </div>

                    <!-- Right Column -->
                    <div class="side-column" id="players-right">
                        <!-- Players injected by JS -->
                    </div>
                </div>
            </main>

            <footer class="game-controls">
                <div class="my-info">
                    <div class="my-avatar">👤</div>
                    <div class="my-details">
                        <div class="my-role" id="my-role">Villager</div>
                        <div class="my-status">Alive</div>
                    </div>
                    <div class="my-status-icons"></div>
                </div>
                <div class="action-area" id="action-area">
                    <div class="action-header">
                        <div id="action-prompt" aria-live="polite">Waiting...</div>
                        <div id="turn-timer" class="turn-timer hidden" aria-label="Turn Timer">⏳ 02:00</div>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="game-input" placeholder="Type a message..." disabled>
                        <button id="voice-input-btn" class="icon-btn" title="Voice Input" aria-label="Voice Input">🎤</button>
                        <button id="send-action-btn" disabled>Send</button>
                    </div>
                    <div id="choice-buttons" class="choice-buttons"></div>
                </div>
            </footer>
        </div>



        <!-- Game Over & Evaluation Modal -->
        <div id="evaluation-modal" class="modal">
            <div class="modal-content game-over-modal-content">
                <span class="close-modal">&times;</span>

                <div class="game-over-tabs">
                    <button id="tab-eval-btn" class="tab-btn active">🤖 Game Evaluation</button>
                    <button id="tab-history-btn" class="tab-btn">📜 Operations History</button>
                </div>
                
                <!-- Tab View: Evaluation -->
                <div id="eval-tab-view" class="game-over-view active">
                    <div id="eval-setup">
                        <p id="eval-intro">Choose a personality for the AI evaluator:</p>
                        <div class="eval-modes">
                            <button class="eval-mode-btn" data-mode="mild">
                                <span class="mode-emoji">😊</span>
                                <span class="mode-title">Mild</span>
                            </button>
                            <button class="eval-mode-btn" data-mode="neutral">
                                <span class="mode-emoji">😐</span>
                                <span class="mode-title">Neutral</span>
                            </button>
                            <button class="eval-mode-btn" data-mode="mean">
                                <span class="mode-emoji">😈</span>
                                <span class="mode-title">Sneer</span>
                            </button>
                        </div>
                        <div id="eval-api-key-section" style="display: none;">
                            <p class="warning-text">API Key required for evaluation</p>
                            <input type="password" id="eval-api-key" placeholder="Enter API Key">
                        </div>
                        <button id="start-eval-btn" class="primary-btn eval-start-btn" disabled>Start Evaluation</button>
                    </div>

                    <div id="eval-chat-section" style="display: none;">
                        <div class="eval-chat-box" id="eval-chat-box">
                            <!-- Evaluation chat messages -->
                        </div>
                        <div class="eval-input-area">
                            <input type="text" id="eval-input" placeholder="Argue with the AI...">
                            <button id="send-eval-btn">Send</button>
                        </div>
                        <button id="new-game-btn" class="primary-btn eval-new-game-btn">New Game</button>
                    </div>
                </div>

                <!-- Tab View: Operations History -->
                <div id="history-tab-view" class="game-over-view" style="display: none;">
                    <div id="op-history-content" class="op-history-container">
                        <p class="op-history-loading">Loading operations...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Records Modal: Unified Chronological Timeline (Plan 1) -->
        <div id="records-modal" class="modal">
            <div class="modal-content records-content">
                <div class="records-header">
                    <div class="records-title-group">
                        <span class="records-icon">📖</span>
                        <h2 id="records-modal-title">对局全景记录</h2>
                    </div>
                    <button class="close-modal-round" id="close-records-btn" aria-label="Close">&times;</button>
                </div>

                <!-- Identity Summary Card -->
                <div id="records-identity-card" class="records-identity-card">
                    <!-- Populated dynamically: role badge, teammates, king, abilities -->
                </div>

                <!-- Filter Pills -->
                <div class="records-filter-bar">
                    <button class="filter-pill active" data-filter="all" id="filter-all-btn">🌟 全部时间线</button>
                    <button class="filter-pill" data-filter="actions" id="filter-actions-btn">🐺 我的行动</button>
                    <button class="filter-pill" data-filter="votes" id="filter-votes-btn">🗳️ 投票明细</button>
                </div>

                <!-- Unified Timeline Body -->
                <div class="records-timeline-container" id="records-timeline-content">
                    <p class="op-history-loading">正在加载时间线...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <template id="player-card-template">
        <div class="player-card">
            <div class="player-me-label">ME</div>
            <div class="player-sheriff-label">SHERIFF</div>
            <div class="player-candidate-label">CANDIDATE</div>
            <div class="player-tie-label">TIE</div>
            <div class="player-dead-label">DEAD</div>
            <div class="player-avatar"></div>
            <div class="player-name"></div>
            <div class="player-status-icons"></div>
            <div class="player-speech-bubble"></div>
        </div>
    </template>

    <script src="/static/js/app.js?v=14"></script>
</body>
</html>
